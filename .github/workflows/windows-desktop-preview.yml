name: Windows Desktop Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/windows-desktop-app]
    paths:
      - 'desktop/**'
      - 'wwwroot/**'
      - '.github/workflows/windows-desktop-preview.yml'

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        run: dotnet publish desktop/AMSSkunkTelemetry.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: AMS-Skunk-Telemetry-Windows-x64-preview
          path: artifacts/windows/
          if-no-files-found: error
