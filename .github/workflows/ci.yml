name: AMS Portal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: dotnet build --configuration Release
      - name: Team membership and read-only sharing
        run: |
          npm ci --prefix tests/database --ignore-scripts --no-audit --no-fund
          npm test --prefix tests/database
      - name: Endurance and driving coach calculations
        env:
          AMS_APP: web
        run: |
          node tests/integration/endurance-planner.mjs
          node tests/integration/engineer-coaching.mjs
      - name: Team and endurance portal flows
        env:
          AMS_APP: web
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
          cd ../..
          node tests/integration/team-endurance-workspace.mjs
          node tests/integration/engineer-workspace.mjs
      - name: Check bilingual JavaScript and integration
        run: |
          node --check wwwroot/js/ams-i18n.js
          node --check wwwroot/js/auth.js
          node --check wwwroot/js/realtime.js
          node --check wwwroot/js/ams-live-pitwall-map.js
          node --check wwwroot/js/ai-engineer.js
          node --check wwwroot/js/ams-welcome.js
          node --check wwwroot/js/ams-context-help.js
          node --check wwwroot/js/ams-public-pages.js
          node scripts/i18n-smoke.mjs

      - name: Engineering telemetry smoke test
        run: node scripts/smoke-test.mjs

      - name: Public pages and navigation
        run: node scripts/public-pages-smoke.mjs

      - name: Preserve 2D map and validate 3D opt-in
        run: |
          node --check wwwroot/js/ams-dual-map-3d-v41.js
          node --check wwwroot/js/app.js
          node scripts/3d-map-safety-smoke.mjs
          node scripts/3d-elevation-drone-smoke.mjs
          node --check wwwroot/js/track-map.js

      - name: Validate concept module JavaScript
        run: |
          node --check wwwroot/js/ams-concepts.js
          node --check wwwroot/js/ams-mockup-v2.js
          node --check wwwroot/js/ams-race-intelligence.js
          node --check wwwroot/js/ams-mini-sector-explorer.js
          node --check wwwroot/js/ams-geometry-corners.js
          node --check wwwroot/js/ams-corner-phases.js
          node --check wwwroot/js/ams-alignment-audit.js
          node --check wwwroot/js/ams-chart-toolbar.js
          node --check wwwroot/js/ams-telemetry-expand.js
          node --check wwwroot/js/ams-map-empty-states.js
