name: AMS Portal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: dotnet build --configuration Release
      - name: Engineering telemetry smoke test
        run: node scripts/smoke-test.mjs

      - name: Validate concept module JavaScript
        run: |
          node --check wwwroot/js/ams-concepts.js
          node --check wwwroot/js/ams-mockup-v2.js
          node --check wwwroot/js/ams-race-intelligence.js
          node --check wwwroot/js/ams-mini-sector-explorer.js
          node --check wwwroot/js/ams-geometry-corners.js
          node --check wwwroot/js/ams-corner-phases.js
          node --check wwwroot/js/ams-alignment-audit.js
